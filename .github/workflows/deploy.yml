name: CI & Deployment Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build, QA & Link Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Astro Static Build & Pagefind Indexing
        run: npm run build

      - name: Audit Internal Links & Funnel Isolation
        run: node scripts/audit-links.mjs

      - name: Validate Schema.org Structured Data
        run: node scripts/validate-schemas.mjs

      - name: Comprehensive QA Inspection
        run: node scripts/qa-check.mjs
